<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro</title>
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="/sistema.css">
</head>
<body>
<div class="fondo" aria-hidden="true">
  <div class="fondo-img" id="fondo-a"></div>
  <div class="fondo-img" id="fondo-b"></div>
  <div class="fondo-tinte" id="tinte"></div>
</div>

<header class="arriba">
  <nav class="ruta" id="ruta" aria-label="Dónde estás"></nav>
  <div class="hora">
    <div class="hora-grande" id="hora"></div>
    <div class="hora-sub"><span id="fecha"></span><span class="vivo">CPU <b id="cpu">–</b> · RAM <b id="ram">–</b></span></div>
  </div>
</header>

<p class="ambiente" id="ambiente" aria-live="off"></p>
<div class="fila" id="fila" role="tablist" aria-label="Apartados"></div>
<div class="columna" id="columna" role="listbox" aria-label="Elementos"></div>
<section class="detalle" id="detalle" aria-live="polite"></section>

<div class="velo" aria-hidden="true"></div>
<footer class="teclas" id="teclas"></footer>
<div class="aviso" id="aviso" role="status" hidden></div>
<div class="cargando" id="cargando">Arrancando…</div>

<script type="module" src="/sistema.js"></script>
</body>
</html>
