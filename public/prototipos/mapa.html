<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro · Mapa</title>
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --fondo: #14161b; --panel: #1b1e24; --texto: #f1f0ec; --suave: #b4b3ac; --tenue: #7b7a74; --linea: #2a2e36;
    --acento: #3987e5;
    --a-programar: #3987e5; --a-navegar: #d95926; --a-juegos: #199e70; --a-multimedia: #c98500; --a-otros: #4b4a46;
    --s-codigos: #3987e5; --s-importante: #d95926; --s-academico: #199e70; --s-banco: #c98500; --s-amazon: #d55181; --s-otros: #4b4a46;
    --din: Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    --mov: 320ms cubic-bezier(.2, .8, .2, 1);
    font: 14px/1.35 var(--din);
  }
  @media (prefers-reduced-motion: reduce) { :root { --mov: 0ms linear; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  :focus-visible { outline: 2px solid #fff; outline-offset: -3px; }

  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 16px 20px 14px; }
  .migas { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 15px; color: var(--suave); white-space: nowrap; overflow: hidden; }
  .migas button { all: unset; cursor: pointer; }
  .migas button:hover { color: var(--texto); text-decoration: underline; text-underline-offset: 3px; }
  .migas b { color: var(--texto); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
  .migas .sep { color: var(--tenue); }
  .lentes { display: flex; background: var(--panel); border-radius: 10px; padding: 3px; gap: 2px; }
  .lentes button { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 8px; color: var(--suave); font-size: 14px; }
  .lentes button[aria-pressed="true"] { background: var(--texto); color: var(--fondo); font-weight: 600; }
  .lentes button:focus-visible { outline: 2px solid var(--acento); }
  .vivo { justify-self: end; display: flex; gap: 18px; color: var(--suave); font-variant-numeric: tabular-nums; }
  .vivo b { color: var(--texto); font-weight: 600; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; padding: 0 20px 18px; min-height: 0; }
  .mapa { position: relative; min-height: 0; border-radius: 6px; overflow: hidden; }
  .capa { position: absolute; inset: 0; transition: transform var(--mov), opacity var(--mov); transform-origin: 0 0; }
  .bloque { position: absolute; padding: 12px 14px; overflow: hidden; cursor: pointer; background: var(--c); color: #fff; border: 0; text-align: left; font: inherit;
    box-shadow: inset 0 0 0 1px rgb(0 0 0 / .35); display: flex; flex-direction: column; justify-content: space-between; transition: filter 120ms; }
  .bloque:hover, .bloque.sel { filter: brightness(1.12); }
  .bloque .n { font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgb(0 0 0 / .25); }
  .bloque .v { font-size: clamp(16px, 2.6vw, 44px); font-weight: 300; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgb(0 0 0 / .2); }
  .bloque .vs { display: flex; flex-direction: column; min-width: 0; }
  .bloque .s { font-size: 12px; opacity: .85; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bloque.chico .v, .bloque.chico .s { display: none; }
  .bloque.mini { padding: 4px 6px; }
  .bloque.mini > * { display: none; }
  .bloque .entra { position: absolute; right: 12px; top: 12px; font-size: 12px; opacity: .8; }
  .bloque .prog { position: absolute; left: 0; bottom: 0; height: 5px; background: rgb(255 255 255 / .75); }

  aside { background: var(--panel); border-radius: 6px; padding: 18px; overflow-y: auto; min-height: 0; }
  .i-tipo { color: var(--tenue); font-size: 13px; }
  .i-nombre { margin: 4px 0 0; font-size: 22px; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
  .i-cifra { margin-top: 16px; font-size: 46px; font-weight: 300; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .i-sub { margin-top: 6px; color: var(--suave); }
  .i-cuota { margin-top: 16px; height: 8px; background: var(--linea); border-radius: 4px; overflow: hidden; }
  .i-cuota i { display: block; height: 100%; background: var(--c, var(--acento)); }
  .i-cuota-t { margin-top: 6px; font-size: 13px; color: var(--suave); }
  aside dl { margin: 18px 0 0; display: grid; grid-template-columns: 105px 1fr; gap: 8px 10px; font-size: 14px; }
  aside dt { color: var(--tenue); }
  aside dd { margin: 0; overflow-wrap: anywhere; }
  .i-nota { margin-top: 16px; color: var(--suave); line-height: 1.5; border-left: 2px solid var(--linea); padding-left: 12px; }
  .i-ayuda { margin-top: 18px; color: var(--tenue); font-size: 13px; line-height: 1.6; }
  kbd { font: 12px var(--din); border: 1px solid var(--linea); border-radius: 4px; padding: 0 5px; color: var(--suave); }
  .vacio { position: absolute; inset: 0; display: grid; place-items: center; color: var(--tenue); text-align: center; padding: 40px; }
</style>
</head>
<body>
<header>
  <nav class="migas" id="migas" aria-label="Dónde estás"></nav>
  <div class="lentes" id="lentes" role="group" aria-label="Qué mide el mapa">
    <button data-lente="tiempo">Tiempo hoy</button>
    <button data-lente="memoria">Memoria</button>
    <button data-lente="proyectos">Proyectos</button>
    <button data-lente="correo">Correo</button>
  </div>
  <div class="vivo"><span>CPU <b id="v-cpu">–</b></span><span>RAM <b id="v-ram">–</b></span><b id="v-hora"></b></div>
</header>
<main>
  <div class="mapa" id="mapa" role="group" aria-label="Mapa"></div>
  <aside id="inspector" aria-live="polite"></aside>
</main>

<script type="module">
import { cargarArbol, vivo, CAT_COLOR, catDeProceso, duracion, mb } from './datos.js';
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- lentes: cada una es un árbol con tamaños ----------
const CATS = ['Programar', 'Navegar', 'Juegos', 'Multimedia', 'Otros'];
const COLOR_SEC = { 'Códigos': 'var(--s-codigos)', Importante: 'var(--s-importante)', 'Académico': 'var(--s-academico)', Banco: 'var(--s-banco)', Amazon: 'var(--s-amazon)', Otros: 'var(--s-otros)' };
let arbol;
function lente(nombre) {
  const sec = (id) => arbol.hijos.find((h) => h.id === id);
  if (nombre === 'tiempo') {
    const apps = sec('apps').hijos;
    return { nombre: 'Tiempo hoy', unidad: duracion, total: 'activo hoy', hijos: CATS.map((c) => {
      const hijos = apps.filter((a) => a.sub === c);
      return { nombre: c, color: CAT_COLOR[c], valor: hijos.reduce((s, a) => s + a.valor, 0), hijos, campos: [['Apps', hijos.length]] };
    }).filter((c) => c.valor > 0) };
  }
  if (nombre === 'memoria') {
    const procs = sec('procesos').hijos;
    return { nombre: 'Memoria', unidad: mb, total: 'en los procesos que más ocupan', hijos: CATS.map((c) => {
      const hijos = procs.filter((p) => catDeProceso(p.nombre) === c);
      return { nombre: c, color: CAT_COLOR[c], valor: hijos.reduce((s, p) => s + p.valor, 0), hijos, campos: [['Procesos', hijos.length]] };
    }).filter((c) => c.valor > 0) };
  }
  if (nombre === 'proyectos') {
    const ps = sec('proyectos').hijos;
    return { nombre: 'Proyectos', unidad: (h) => `${h.toLocaleString('es-ES', { maximumFractionDigits: 1 })} h`, total: 'de trabajo en commits', tamano: 'horas',
      hijos: ps.map((p) => ({ ...p, color: porProgreso(p.progreso), hijos: p.hijos.map((f) => ({ ...f, color: porProgreso(f.progreso) })) })) };
  }
  const secs = sec('correo').hijos;
  return { nombre: 'Correo', unidad: (n) => `${Math.round(n)}`, total: 'correos en 3 días',
    hijos: secs.filter((s) => s.hijos.length).map((s) => ({ ...s, valor: s.hijos.length, color: COLOR_SEC[s.nombre], hijos: s.hijos.map((m) => ({ ...m, color: COLOR_SEC[s.nombre] })) })) };
}

// ---------- treemap squarified ----------
function squarify(items, x, y, w, h) {
  const total = items.reduce((s, i) => s + i.valor, 0);
  if (!total || !items.length) return [];
  const area = w * h;
  const datos = items.map((i) => ({ i, a: (i.valor / total) * area })).sort((p, q) => q.a - p.a);
  const out = [];
  let fila = [];
  const peor = (f, lado) => { const s = f.reduce((t, r) => t + r.a, 0); const mx = Math.max(...f.map((r) => r.a)); const mn = Math.min(...f.map((r) => r.a)); return Math.max((lado * lado * mx) / (s * s), (s * s) / (lado * lado * mn)); };
  const colocar = () => {
    const s = fila.reduce((t, r) => t + r.a, 0);
    if (w >= h) { const ancho = s / h; let yy = y; for (const r of fila) { const alto = r.a / ancho; out.push({ ...r, x, y: yy, w: ancho, h: alto }); yy += alto; } x += ancho; w -= ancho; }
    else { const alto = s / w; let xx = x; for (const r of fila) { const ancho = r.a / alto; out.push({ ...r, x: xx, y, w: ancho, h: alto }); xx += ancho; } y += alto; h -= alto; }
    fila = [];
  };
  for (const d of datos) {
    const lado = Math.min(w, h);
    if (!fila.length || peor([...fila, d], lado) <= peor(fila, lado)) fila.push(d);
    else { colocar(); fila.push(d); }
  }
  if (fila.length) colocar();
  return out;
}

// ---------- estado y pintado ----------
let lenteActual = 'tiempo';
let pila = []; // nodos en los que has entrado
let sel = null;
const nodoVisible = () => pila.at(-1);
const enProyecto = () => pila[0].tamano === 'horas' && pila.length > 1;
const fmt = (n, v) => (enProyecto() ? `${v} tareas` : pila[0].unidad(v));
const cifra = (n) => (enProyecto() && n.progreso != null ? `${n.progreso} %` : pila[0].unidad(n.valor));
const detalle = (n, total) => (enProyecto() ? n.sub : pila[0].tamano === 'horas' ? `${n.progreso ?? 0} % hecho` : n.sub && pila.length > 1 ? n.sub : `${Math.round((100 * n.valor) / total)} % del total`);
// Secuencial de un solo tono: cuanto más hecho, más intenso (mismo azul de la paleta).
const porProgreso = (p) => `color-mix(in oklab, var(--acento) ${Math.round(22 + 0.78 * (p ?? 0))}%, #20242c)`;

function pintar(origen) {
  const nodo = nodoVisible();
  const mapa = $('#mapa');
  const W = mapa.clientWidth, H = mapa.clientHeight;
  const hijos = (nodo.hijos || []).filter((h) => h.valor > 0);
  const capa = document.createElement('div');
  capa.className = 'capa';
  const total = hijos.reduce((s, h) => s + h.valor, 0);
  if (!hijos.length) capa.innerHTML = '<div class="vacio">Aquí todavía no hay nada que medir. La actividad se va llenando mientras usas el PC.</div>';
  for (const r of squarify(hijos, 0, 0, W, H)) {
    const n = r.i;
    const b = document.createElement('button');
    const area = r.w * r.h;
    b.className = 'bloque' + (area < 9000 || r.h < 70 ? ' chico' : '') + (r.w < 60 || r.h < 34 ? ' mini' : '');
    b.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;--c:${n.color || 'var(--a-otros)'}`;
    b.setAttribute('aria-label', `${n.nombre}: ${fmt(n, n.valor)}, ${Math.round((100 * n.valor) / total)} %`);
    b.innerHTML = `<span class="n">${esc(n.nombre)}</span><span class="vs"><span class="v">${esc(cifra(n))}</span><span class="s">${esc(detalle(n, total))}</span></span>
      ${n.hijos?.filter((h) => h.valor > 0).length ? `<span class="entra">${n.hijos.length} ›</span>` : ''}
      ${n.progreso != null ? `<span class="prog" style="width:${n.progreso}%"></span>` : ''}`;
    b.addEventListener('mouseenter', () => inspeccionar(n, total));
    b.addEventListener('focus', () => inspeccionar(n, total));
    b.addEventListener('click', () => entrar(n, r));
    capa.append(b);
  }
  // zoom: la capa nueva crece desde el bloque pulsado (o encoge hacia él al volver)
  const vieja = mapa.querySelector('.capa');
  if (origen && vieja) {
    const { x, y, w, h, salir } = origen;
    if (!salir) {
      capa.style.transform = `translate(${x}px, ${y}px) scale(${w / W}, ${h / H})`;
      capa.style.opacity = '0';
      mapa.append(capa);
      requestAnimationFrame(() => { capa.style.transform = ''; capa.style.opacity = '1'; });
      vieja.style.opacity = '0';
    } else {
      mapa.prepend(capa);
      vieja.style.transform = `translate(${x}px, ${y}px) scale(${w / W}, ${h / H})`;
      vieja.style.opacity = '0';
    }
    setTimeout(() => vieja.remove(), 360);
  } else {
    mapa.replaceChildren(capa);
  }
  pintarMigas();
  inspeccionar(sel && hijos.includes(sel) ? sel : nodo, total, true);
}

function pintarMigas() {
  $('#migas').innerHTML = pila.map((n, i) => i === pila.length - 1
    ? `<b>${esc(n.nombre)}</b>` : `<button data-i="${i}">${esc(n.nombre)}</button><span class="sep">›</span>`).join('');
}

function inspeccionar(n, total, esNivel) {
  sel = esNivel ? null : n;
  const raiz = nodoVisible();
  const cuota = !esNivel && total ? Math.round((100 * n.valor) / total) : null;
  const totalNivel = (raiz.hijos || []).reduce((s, h) => s + (h.valor || 0), 0);
  $('#inspector').innerHTML = `
    <div class="i-tipo">${esNivel ? (pila.length > 1 ? pila.at(-2).nombre : 'Todo tu PC') : esc(raiz.nombre)}</div>
    <h1 class="i-nombre">${esc(n.nombre)}</h1>
    <div class="i-cifra">${esc(esNivel ? fmt(n, totalNivel) : fmt(n, n.valor))}</div>
    <div class="i-sub">${esc(esNivel ? (pila.length === 1 ? pila[0].total : n.sub || '') : n.sub || '')}</div>
    ${cuota != null ? `<div class="i-cuota" style="--c:${n.color}"><i style="width:${cuota}%"></i></div><div class="i-cuota-t">${cuota} % de ${esc(raiz.nombre)}</div>` : ''}
    ${n.campos ? `<dl>${n.campos.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
    ${n.texto ? `<div class="i-nota">${esc(n.texto)}</div>` : ''}
    <div class="i-ayuda">${esNivel ? 'Pasa el ratón por un bloque para verlo. Clic para entrar. <kbd>Esc</kbd> para salir.' : n.hijos?.length ? `Clic para entrar en sus ${n.hijos.length} elementos.` : ''}</div>`;
}

function entrar(n, r) {
  if (!n.hijos?.filter((h) => h.valor > 0).length) { inspeccionar(n, (nodoVisible().hijos || []).reduce((s, h) => s + h.valor, 0)); return; }
  pila.push(n);
  pintar(r);
}
function salir() {
  if (pila.length < 2) return;
  const hijo = pila.pop();
  // encoge la capa actual hacia el bloque del que salió
  const W = $('#mapa').clientWidth, H = $('#mapa').clientHeight;
  const r = squarify((nodoVisible().hijos || []).filter((h) => h.valor > 0), 0, 0, W, H).find((x) => x.i === hijo);
  pintar(r ? { ...r, salir: true } : null);
}
function cambiarLente(l) {
  lenteActual = l;
  document.querySelectorAll('[data-lente]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lente === l)));
  pila = [lente(l)];
  pintar();
}

$('#lentes').addEventListener('click', (e) => { const b = e.target.closest('[data-lente]'); if (b) cambiarLente(b.dataset.lente); });
$('#migas').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { pila = pila.slice(0, +b.dataset.i + 1); pintar(); } });
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); salir(); }
  const n = { 1: 'tiempo', 2: 'memoria', 3: 'proyectos', 4: 'correo' }[e.key];
  if (n) cambiarLente(n);
});
$('#mapa').addEventListener('contextmenu', (e) => { e.preventDefault(); salir(); });
addEventListener('resize', () => pintar());

setInterval(() => { $('#v-hora').textContent = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }, 1000);
vivo((v) => { $('#v-cpu').textContent = `${Math.round(v.ahora.cpu ?? 0)} %`; $('#v-ram').textContent = `${Math.round(v.ahora.ram ?? 0)} %`; });
arbol = await cargarArbol();
const [l, entra] = location.hash.slice(1).split('/');
cambiarLente(['tiempo', 'memoria', 'proyectos', 'correo'].includes(l) ? l : 'tiempo');
if (entra) { const n = pila[0].hijos.find((h) => h.nombre === decodeURIComponent(entra)); if (n) { pila.push(n); pintar(); } }
</script>
</body>
</html>
